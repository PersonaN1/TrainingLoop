name: TrainingLoop
options:
  bundleIdPrefix: io.github.personan1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  TrainingLoopCore:
    path: Packages/TrainingLoopCore
targets:
  TrainingLoop:
    type: application
    platform: iOS
    sources:
      - path: TrainingLoop
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: TrainingLoopCore
      - target: TrainingLoopWidgets
    info:
      path: TrainingLoop/Info.plist
      properties:
        CFBundleDisplayName: TrainingLoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.personan1.trainingloop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TrainingLoopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TrainingLoopWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: TrainingLoopCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: TrainingLoopWidgets/Info.plist
      properties:
        CFBundleDisplayName: TrainingLoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.personan1.trainingloop.widgets
  # Hosted by the app: saving workouts and recounting after edits on an in-memory store (TECH T12).
  TrainingLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainingLoopTests
        type: syncedFolder
    dependencies:
      - target: TrainingLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.personan1.trainingloop.tests
        GENERATE_INFOPLIST_FILE: YES
  TrainingLoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrainingLoopUITests
        type: syncedFolder
    dependencies:
      - target: TrainingLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.personan1.trainingloop.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrainingLoop:
    build:
      targets:
        TrainingLoop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrainingLoopTests
        - TrainingLoopUITests
    archive:
      config: Release
